[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipette-adversarial"
version = "0.1.0"
description = "Quantization-aware adversarial robustness benchmark for on-device models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.3.0"]
dev = ["pytest-cov", "ruff", "mypy"]

[project.scripts]
pipette-adversarial = "pipette_adversarial.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipette_adversarial"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
